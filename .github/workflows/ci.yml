name: CI

# Runs the test suites that already exist but had nothing running them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # conftest.py injects fake Supabase/Gemini credentials at import time and
        # disables the diagnostics sink, so no real secrets are needed here.
        run: python -m pytest -q

      - name: Assert no swallowed diagnostics were reintroduced
        working-directory: backend
        # Redundant with the suite above, but named separately so a regression
        # in error visibility is obvious from the job list rather than buried.
        run: python -m pytest tests/test_no_swallowed_diagnostics.py -q

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Lint
        # Blocking. The repo is at zero lint ERRORS; the 11 remaining
        # react-refresh warnings are cosmetic (HMR granularity) and do not fail
        # the build. Keep it blocking so the backlog cannot silently return.
        run: bun run lint

      - name: Production build
        env:
          # vite.config.ts refuses to build without this: the bundle inlines the
          # API URL, so an unset value would hard-code http://localhost:8000 and
          # break the deployment for every visitor.
          VITE_API_URL: https://ci.example.invalid
        run: bun run build

      - name: Assert no dev-only code in the production bundle
        run: |
          fail=0
          for needle in "__diag/ingest" "node:fs" "localhost:8000"; do
            if grep -rl -- "$needle" .output/public >/dev/null 2>&1; then
              echo "::error::'$needle' leaked into the client bundle"
              fail=1
            fi
          done
          exit $fail
